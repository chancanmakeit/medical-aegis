# Pilot 2026-10-20 (user-approved): triage_agent, response_corruption, single target {'role': 'Doctor', 'role_index': 1, 'phase': 'classify'}, FM-2.3, scheme A.
# Same config for both backbones (mercury-2.5-preview, llama-4-maverick).
run_mode: inject
injection_method: direct_prepend
triage_config_name: config_triage
inject_every_invocation: false
system_under_test:
  name: triage_agent
  wrapper_class_path: aegis_core.agent_systems.fm_triage_agent_wrapper.FMTriageAgentWrapper
  method_config_path: methods/triage_agent/configs/config_triage.yaml
llm_config:
  provider: openai
  model_name: YOUR_MODEL
  model_url: YOUR_BASE_URL
  api_key: YOUR_API_KEY
  temperature: 0.0
use_llm_judge: true
judge_mode: regex_first
injection_plan:
  targets:
  - role: Doctor
    role_index: 1
    phase: classify
    attack_spec:
      fm_error_type: FM-2.3
      injection_strategy: response_corruption
experiment_settings:
  max_workers: 4
generate_injection_descriptions: false
task_type: classification_field
prompt_wrapper_style: direct
