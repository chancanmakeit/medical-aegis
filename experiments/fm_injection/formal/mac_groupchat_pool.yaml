# Formal-generation draft for MAC (mac_groupchat), modelled on
# medagents_mc_pool.yaml. NOT run yet.
# One target per run, drawn uniformly (seeded by sample id + run_index) from
# targets_pool. Attacks: prompt_injection (simulation wrapper, rewrite-pool
# wording) with FM-1.1 / 2.3 / 2.5 / 3.2 / 3.3, and response_corruption FM-2.6
# in place (rc_mode inplace; a Supervisor's summary-JSON letter is changed by
# the MAC wrapper; a reply with no answer to change is redone as a prompt
# injection, rc_fallback pi).
# Targets: each Doctor's first turn, the Supervisor's first turn, and the first
# speaker-selection call (prompt injection only: corrupting a speaker name is
# not an answer error). Doctor / Supervisor targets exist only when the
# selector picks that agent at least once; such runs come out `fired: false`
# (labels.outcome not_fired) and should be counted / resampled.
# TODO: role-pattern targets ("the k-th turn of whoever speaks", e.g. the
# speaker of turn 3) are not supported by the target matcher yet; pinning
# `round` on a role target only fires if that role happens to speak then.
run_mode: inject
injection_method: direct_prepend
mac_config_name: config_mac
inject_every_invocation: false
system_under_test:
  name: mac_groupchat
  wrapper_class_path: aegis_core.agent_systems.fm_mac_structured_wrapper.FMMACStructuredWrapper
  method_config_path: methods/mac_groupchat/configs/config_mac.yaml
llm_config:
  provider: openai
  model_name: YOUR_MODEL
  model_url: YOUR_BASE_URL
  api_key: YOUR_API_KEY
  temperature: 0.7
benchmark_name: medxpertqa-text
use_llm_judge: true
judge_mode: regex_first
experiment_settings:
  max_workers: 4
generate_injection_descriptions: false
task_type: mcq
prompt_wrapper_style: simulation
injection_plan:
  seed: 20261021
  targets_pool:
  - role: Doctor
    role_index: 0
    phase: discussion
  - role: Doctor
    role_index: 1
    phase: discussion
  - role: Doctor
    role_index: 2
    phase: discussion
  - role: Doctor
    role_index: 3
    phase: discussion
  - role: Supervisor
    role_index: 0
    phase: supervision
  - role: Selector
    role_index: 0
    phase: select_speaker
    round: 1
    strategies:
    - prompt_injection
  attack_pool:
  - fm_error_type: FM-1.1
    injection_strategy: prompt_injection
  - fm_error_type: FM-2.3
    injection_strategy: prompt_injection
  - fm_error_type: FM-2.5
    injection_strategy: prompt_injection
  - fm_error_type: FM-3.2
    injection_strategy: prompt_injection
  - fm_error_type: FM-3.3
    injection_strategy: prompt_injection
  - fm_error_type: FM-2.6
    injection_strategy: response_corruption
rc_mode: inplace
rc_fallback: pi
injection_seed: 20261021
template_pool: malicious_factory/rewrite_pool.json
template_pool_model: default
