# GEMINI batch (v11 r9, user 2026-11-03): MAM on the audio sets with gemini-2.5-flash-lite for BOTH the text
# and the audio roles (upstream uses two different models; see the report). temperature 0.7 (anchor convention).
run_mode: "clean"
mam_config_name: "config_audio"
system_under_test:
  name: "mam"
  wrapper_class_path: "aegis_core.agent_systems.fm_mam_wrapper.FMMAMWrapper"
  method_config_path: "methods/mam/configs/config_audio.yaml"
llm_config:
  provider: "openai"
  model_name: "mimo-v2.6-flash"
  model_url: "https://api.xiaomimimo.com/v1"
  api_key: "YOUR_API_KEY"
  temperature: 0.7
use_llm_judge: true
judge_mode: "regex_first"
experiment_settings:
  max_workers: 4
