# TriageAgent INJECTION config -> ERROR trajectories. See triage_agent_triage_normal.yaml for data prep.
#   python main.py --method_name triage_agent \
#     --experiment_config experiments/fm_injection/triage/triage_agent_triage_inject.yaml \
#     --dataset_file ./datasets/data/triage_esi.json --test_dataset_name triage_esi --model_name <model>
run_mode: "inject"
injection_method: "direct_prepend"
triage_config_name: "config_triage"
inject_every_invocation: false

system_under_test:
  name: "triage_agent"
  wrapper_class_path: "aegis_core.agent_systems.fm_triage_agent_wrapper.FMTriageAgentWrapper"
  method_config_path: "methods/triage_agent/configs/config_triage.yaml"

llm_config:
  provider: "openai"
  model_name: "YOUR_MODEL"
  model_url: "YOUR_BASE_URL"
  api_key: "YOUR_API_KEY"
  temperature: 0.0

use_llm_judge: true
judge_mode: "regex_first"

# Structural sites: Doctor(0)=Doctor A, Doctor(1)=Doctor B, Doctor(2)=Doctor C
#   (phases "classify" and "discuss", round k), Summarizer(0) ("summarize"),
#   Coordinator(0) ("consensus"). A target fires on the FIRST matching call
#   (inject_every_invocation: false); pin `phase` / `round` to hit a later one.
#   Doctor A's classify answer is "Coarse class: HIGH|LOW"; every other agent
#   answers "ESI level: N" (Summarizer: "Suggested ESI level: N"). The wrapper
#   sets the matching field / labels for the factory per target.
injection_plan:
  targets:
    - role: "Doctor"
      role_index: 0
      attack_spec:
        fm_error_type: "FM-2.3"
        injection_strategy: "prompt_injection"
    - role: "Summarizer"
      role_index: 0
      attack_spec:
        fm_error_type: "FM-2.3"
        injection_strategy: "response_corruption"

experiment_settings:
  max_workers: 5

generate_injection_descriptions: false

task_type: "classification_field"
prompt_wrapper_style: "direct"
