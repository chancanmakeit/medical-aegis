# ConSensus-repo CMD (cross-group debate + secretary) baseline, INJECTION config -> ERROR trajectories.
# See consensus_cmd_sensing_normal.yaml for data prep.
#   python main.py --method_name consensus_cmd \
#     --experiment_config experiments/fm_injection/sensing/consensus_cmd_sensing_inject.yaml \
#     --dataset_file ./datasets/data/sleepedf.json --test_dataset_name sleepedf --model_name <model>
run_mode: "inject"
injection_method: "direct_prepend"
consensus_config_name: "config_sensing"
inject_every_invocation: false

system_under_test:
  name: "consensus_cmd"
  wrapper_class_path: "aegis_core.agent_systems.fm_consensus_wrapper.FMConSensusWrapper"
  method_config_path: "methods/consensus_baselines/configs/config_sensing.yaml"

llm_config:
  provider: "openai"
  model_name: "YOUR_MODEL"
  model_url: "YOUR_BASE_URL"
  api_key: "YOUR_API_KEY"
  temperature: 0.0

use_llm_judge: true
judge_mode: "regex_first"

# Structural sites: ModalityAgent(i) [i = modality position in info.json:
#   SleepEDF 0 EEG-Fpz-Cz, 1 EEG-Pz-Oz, 2 EOG-horizontal, 3 EMG-submental, 4 Resp-oro-nasal]
#   (phases "interpretation" and, in rounds 1-2, "debate"), Secretary(0) (phase "tie_break").
# Injection fires on the FIRST call of a (role, role_index) (inject_every_invocation: false):
#   ModalityAgent(1) -> its interpretation call. Secretary(0) is only called when the
#   second-debate vote is tied, so on samples without a tie that target stays un-fired.
injection_plan:
  targets:
    - role: "ModalityAgent"
      role_index: 1
      attack_spec:
        fm_error_type: "FM-2.3"
        injection_strategy: "prompt_injection"
    - role: "Secretary"
      role_index: 0
      attack_spec:
        fm_error_type: "FM-2.3"
        injection_strategy: "response_corruption"

experiment_settings:
  max_workers: 5

generate_injection_descriptions: false

# Agents answer in {"REASON","ANSWER"} JSON with a class label.
task_type: "classification"
prompt_wrapper_style: "direct"
