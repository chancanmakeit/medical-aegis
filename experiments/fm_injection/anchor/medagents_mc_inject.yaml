# ANCHOR task (user decision 2026-10-21): medagents_mc on datasets/data/anchor_medxpertqa100.json,
# llama-4-maverick only; normal K=4 (--num_runs 4 --no_inject) + 2 injected runs per
# question (--num_runs 2 with this file: run 0 = response corruption in place, run 1 =
# prompt injection; target drawn from targets_pool). Rounds capped at 2 (user): votes: max_attempt_vote 3 -> 2.
# 2026-10-21 PI fix: FM-3.3 only on verifying roles; injected replies length-matched to a
# clean reference reply (re-sampled up to 3 times into [0.6, 1.5] x its length).
# 2026-10-21 PI fix v2: state the reference reply's word count in the note; range [0.8, 1.25], 4 tries.
run_mode: inject
injection_method: direct_prepend
system_under_test:
  name: medagents_mc
  wrapper_class_path: aegis_core.agent_systems.fm_medagents_mc_wrapper.FMMedAgentsMCWrapper
  method_config_path: configs/config_medical.yaml
llm_config:
  provider: openai
  model_name: YOUR_MODEL
  model_url: YOUR_BASE_URL
  api_key: YOUR_API_KEY
  temperature: 0.7
benchmark_name: medxpertqa-text
use_llm_judge: true
judge_mode: regex_first
experiment_settings:
  max_workers: 4
generate_injection_descriptions: false
task_type: mcq
prompt_wrapper_style: simulation
rc_mode: inplace
rc_fallback: pi
injection_seed: 20261021
template_pool: malicious_factory/rewrite_pool.json
template_pool_model: default
medagents_config_name: config_medical
medagents_max_attempt_vote: 2
injection_plan:
  seed: 20261021
  strategy_cycle:
  - response_corruption
  - prompt_injection
  targets_pool:
  - role: QuestionAnalyst
    role_index: 0
    phase: question_analysis
    strategies: &id001
    - prompt_injection
  - role: QuestionAnalyst
    role_index: 1
    phase: question_analysis
    strategies: *id001
  - role: QuestionAnalyst
    role_index: 2
    phase: question_analysis
    strategies: *id001
  - role: QuestionAnalyst
    role_index: 3
    phase: question_analysis
    strategies: *id001
  - role: QuestionAnalyst
    role_index: 4
    phase: question_analysis
    strategies: *id001
  - role: OptionAnalyst
    role_index: 0
    phase: option_analysis
  - role: OptionAnalyst
    role_index: 1
    phase: option_analysis
  - role: Synthesizer
    role_index: 0
    phase: synthesis
  - role: Voter
    role_index: 0
    phase: consensus_vote
    round: 1
    strategies: *id001
  - role: Voter
    role_index: 1
    phase: consensus_vote
    round: 1
    strategies: *id001
  - role: Voter
    role_index: 2
    phase: consensus_vote
    round: 1
    strategies: *id001
  - role: Voter
    role_index: 3
    phase: consensus_vote
    round: 1
    strategies: *id001
  - role: Voter
    role_index: 4
    phase: consensus_vote
    round: 1
    strategies: *id001
  - role: Voter
    role_index: 5
    phase: consensus_vote
    round: 1
    strategies: *id001
  - role: Voter
    role_index: 6
    phase: consensus_vote
    round: 1
    strategies: *id001
  - role: Decider
    role_index: 0
    phase: decision
  attack_pool:
  - fm_error_type: FM-1.1
    injection_strategy: prompt_injection
  - fm_error_type: FM-2.3
    injection_strategy: prompt_injection
  - fm_error_type: FM-2.5
    injection_strategy: prompt_injection
  - fm_error_type: FM-3.2
    injection_strategy: prompt_injection
  - fm_error_type: FM-3.3
    injection_strategy: prompt_injection
    roles:
    - Voter
    - Decider
  - fm_error_type: FM-2.6
    injection_strategy: response_corruption
pi_length_match:
  min_ratio: 0.8
  max_ratio: 1.25
  max_tries: 4
  state_length: true
