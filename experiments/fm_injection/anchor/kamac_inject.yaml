# ANCHOR task (user decision 2026-10-21): kamac on datasets/data/anchor_medxpertqa100.json,
# llama-4-maverick only; normal K=4 (--num_runs 4 --no_inject) + 2 injected runs per
# question (--num_runs 2 with this file: run 0 = response corruption in place, run 1 =
# prompt injection; target drawn from targets_pool). Rounds capped at 2 (user): debate turns: num_turns 3 -> 2, turn-cap extensions 3 -> 0; directed-message steps not targeted (turn-1 messages never reach anyone, MHT r31).
run_mode: inject
injection_method: direct_prepend
system_under_test:
  name: kamac
  wrapper_class_path: aegis_core.agent_systems.fm_kamac_structured_wrapper.FMKAMACStructuredWrapper
  method_config_path: methods/kamac/configs/config_kamac.yaml
llm_config:
  provider: openai
  model_name: YOUR_MODEL
  model_url: YOUR_BASE_URL
  api_key: YOUR_API_KEY
  temperature: 0.7
benchmark_name: medxpertqa-text
use_llm_judge: true
judge_mode: regex_first
experiment_settings:
  max_workers: 4
generate_injection_descriptions: false
task_type: mcq
prompt_wrapper_style: simulation
rc_mode: inplace
rc_fallback: pi
injection_seed: 20261021
template_pool: malicious_factory/rewrite_pool.json
template_pool_model: default
kamac_config_name: config_kamac
kamac_num_turns: 2
kamac_max_turn_extensions: 0
injection_plan:
  seed: 20261021
  strategy_cycle:
  - response_corruption
  - prompt_injection
  targets_pool:
  - role: Recruiter
    role_index: 0
    phase: recruitment
    strategies: &id001
    - prompt_injection
  - role: Expert
    role_index: 0
    phase: initial_assessment
  - role: Expert
    role_index: 0
    phase: participate
    round: 1
    strategies: *id001
  - role: Expert
    role_index: 0
    phase: knowledge_gap
    round: 1
    strategies: *id001
  - role: Moderator
    role_index: 0
    phase: decision
  attack_pool:
  - fm_error_type: FM-1.1
    injection_strategy: prompt_injection
  - fm_error_type: FM-2.3
    injection_strategy: prompt_injection
  - fm_error_type: FM-2.5
    injection_strategy: prompt_injection
  - fm_error_type: FM-3.2
    injection_strategy: prompt_injection
  - fm_error_type: FM-3.3
    injection_strategy: prompt_injection
  - fm_error_type: FM-2.6
    injection_strategy: response_corruption
