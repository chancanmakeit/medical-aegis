# KAMAC INJECTION config -> ERROR trajectories (anchor framework, MedXpertQA-Text).
# One fixed target: the first initial expert's independent answer, response
# corruption FM-2.6 in place (only the answer letter changes); a reply with no
# answer to change is redone as a prompt injection (rc_fallback pi).
# Run: python main.py --method_name kamac \
#        --experiment_config experiments/fm_injection/anchor/kamac_inject.yaml \
#        --dataset_file ./datasets/data/medxpertqa_text.json --test_dataset_name medxpertqa_text \
#        --model_name <model> --model_temperature 0.7
run_mode: "inject"
injection_method: "direct_prepend"

kamac_config_name: "config_kamac"

# Each target fires only on its FIRST matching call.
inject_every_invocation: false

system_under_test:
  name: "kamac"
  wrapper_class_path: "aegis_core.agent_systems.fm_kamac_structured_wrapper.FMKAMACStructuredWrapper"
  method_config_path: "methods/kamac/configs/config_kamac.yaml"

llm_config:
  provider: "openai"
  model_name: "YOUR_MODEL"
  model_url: "YOUR_BASE_URL"
  api_key: "YOUR_API_KEY"
  temperature: 0.7

benchmark_name: "medxpertqa-text"

use_llm_judge: true
judge_mode: "regex_first"

# Structural roles (fm_kamac_structured_wrapper.py): Recruiter(0), Expert(i),
# Recruit(k) [k-th recruited expert; does not fire if never recruited],
# Assistant(0), Moderator(0).
injection_plan:
  targets:
    - role: "Expert"
      role_index: 0
      phase: "initial_assessment"
      attack_spec:
        fm_error_type: "FM-2.6"
        injection_strategy: "response_corruption"

rc_mode: inplace
rc_fallback: pi

experiment_settings:
  max_workers: 4

generate_injection_descriptions: false

task_type: "mcq"
prompt_wrapper_style: "simulation"
