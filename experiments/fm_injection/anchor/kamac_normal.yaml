# KAMAC CLEAN config -> NORMAL trajectories (anchor framework, MedXpertQA-Text).
# Run: python main.py --method_name kamac \
#        --experiment_config experiments/fm_injection/anchor/kamac_normal.yaml \
#        --dataset_file ./datasets/data/medxpertqa_text.json --test_dataset_name medxpertqa_text \
#        --model_name <model> --model_temperature 0.7 --num_runs 4 --no_inject
run_mode: "clean"

kamac_config_name: "config_kamac"
# Optional overrides of methods/kamac/configs/config_kamac.yaml:
# kamac_num_agents: 1          # initial experts (upstream default 1)
# kamac_num_turns: 3
# kamac_max_recruits: 4
# kamac_message_delivery: "upstream"   # or "inbox"

system_under_test:
  name: "kamac"
  wrapper_class_path: "aegis_core.agent_systems.fm_kamac_structured_wrapper.FMKAMACStructuredWrapper"
  method_config_path: "methods/kamac/configs/config_kamac.yaml"

llm_config:
  provider: "openai"
  model_name: "YOUR_MODEL"
  model_url: "YOUR_BASE_URL"
  api_key: "YOUR_API_KEY"
  temperature: 0.7

benchmark_name: "medxpertqa-text"

use_llm_judge: true
judge_mode: "regex_first"

experiment_settings:
  max_workers: 4
