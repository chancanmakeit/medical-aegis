# ANCHOR task (user decision 2026-10-21): mac_groupchat on datasets/data/anchor_medxpertqa100.json,
# llama-4-maverick only; normal K=4 (--num_runs 4 --no_inject) + 2 injected runs per
# question (--num_runs 2 with this file: run 0 = response corruption in place, run 1 =
# prompt injection; target drawn from targets_pool). Rounds capped at 2 (user): n_round 8 (<= 7 speaker turns = under 2 full rounds of 4 doctors + supervisor); not lowered further, a 'round' here is one speaker turn.
run_mode: inject
injection_method: direct_prepend
system_under_test:
  name: mac_groupchat
  wrapper_class_path: aegis_core.agent_systems.fm_mac_structured_wrapper.FMMACStructuredWrapper
  method_config_path: methods/mac_groupchat/configs/config_mac.yaml
llm_config:
  provider: openai
  model_name: YOUR_MODEL
  model_url: YOUR_BASE_URL
  api_key: YOUR_API_KEY
  temperature: 0.7
benchmark_name: medxpertqa-text
use_llm_judge: true
judge_mode: regex_first
experiment_settings:
  max_workers: 4
generate_injection_descriptions: false
task_type: mcq
prompt_wrapper_style: simulation
rc_mode: inplace
rc_fallback: pi
injection_seed: 20261021
template_pool: malicious_factory/rewrite_pool.json
template_pool_model: default
mac_config_name: config_mac
injection_plan:
  seed: 20261021
  strategy_cycle:
  - response_corruption
  - prompt_injection
  targets_pool:
  - role: Doctor
    role_index: 0
    phase: discussion
  - role: Doctor
    role_index: 1
    phase: discussion
  - role: Doctor
    role_index: 2
    phase: discussion
  - role: Doctor
    role_index: 3
    phase: discussion
  - role: Supervisor
    role_index: 0
    phase: supervision
  - role: Selector
    role_index: 0
    phase: select_speaker
    round: 1
    strategies:
    - prompt_injection
  attack_pool:
  - fm_error_type: FM-1.1
    injection_strategy: prompt_injection
  - fm_error_type: FM-2.3
    injection_strategy: prompt_injection
  - fm_error_type: FM-2.5
    injection_strategy: prompt_injection
  - fm_error_type: FM-3.2
    injection_strategy: prompt_injection
  - fm_error_type: FM-3.3
    injection_strategy: prompt_injection
  - fm_error_type: FM-2.6
    injection_strategy: response_corruption
