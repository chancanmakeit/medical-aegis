# ANCHOR task (normal runs) (user decision 2026-10-21): mac_groupchat on datasets/data/anchor_medxpertqa100.json,
# llama-4-maverick only; normal K=4 (--num_runs 4 --no_inject) + 2 injected runs per
# question (--num_runs 2 with this file: run 0 = response corruption in place, run 1 =
# prompt injection; target drawn from targets_pool). Rounds capped at 2 (user): n_round 8 (<= 7 speaker turns = under 2 full rounds of 4 doctors + supervisor); not lowered further, a 'round' here is one speaker turn.
run_mode: clean
injection_method: direct_prepend
system_under_test:
  name: mac_groupchat
  wrapper_class_path: aegis_core.agent_systems.fm_mac_structured_wrapper.FMMACStructuredWrapper
  method_config_path: methods/mac_groupchat/configs/config_mac.yaml
llm_config:
  provider: openai
  model_name: YOUR_MODEL
  model_url: YOUR_BASE_URL
  api_key: YOUR_API_KEY
  temperature: 0.7
benchmark_name: medxpertqa-text
use_llm_judge: true
judge_mode: regex_first
experiment_settings:
  max_workers: 4
generate_injection_descriptions: false
task_type: mcq
mac_config_name: config_mac
