# MedAgents (MC) INJECTION config -> ERROR trajectories.
# Run: python main.py --method_name medagents_mc \
#        --experiment_config experiments/fm_injection/medical/medagents_mc_medical_inject.yaml \
#        --dataset_file ./datasets/data/<dataset>.json --test_dataset_name <name> --model_name <model>
run_mode: "inject"
injection_method: "direct_prepend"
medagents_config_name: "config_medical"

# Voter / Advisor / Reviser can be called once per consultation round. By default
# an injection fires only on the FIRST matching call (same as mdagents /
# clinical_agent / cmas). Final cross-framework policy (A/B) is pending.
inject_every_invocation: false

system_under_test:
  name: "medagents_mc"
  wrapper_class_path: "aegis_core.agent_systems.fm_medagents_mc_wrapper.FMMedAgentsMCWrapper"
  method_config_path: "configs/config_medical.yaml"

llm_config:
  provider: "openai"
  model_name: "YOUR_MODEL"
  model_url: "YOUR_BASE_URL"
  api_key: "YOUR_API_KEY"
  temperature: 0.0

benchmark_name: "medconceptsqa"

use_llm_judge: true
judge_mode: "regex_first"

# Structural injection sites (see fm_medagents_mc_wrapper.py):
#   QuestionClassifier(0) OptionClassifier(0) QuestionAnalyst(0..4) OptionAnalyst(0..1)
#   Synthesizer(0) Voter(0..6) Advisor(0..6)* Reviser(0)* Decider(0)
#   (* only called when some voter says NO -> the target may not fire; the log
#    records `fired` per target.)
injection_plan:
  targets:
    - role: "QuestionAnalyst"
      role_index: 0
      attack_spec:
        fm_error_type: "FM-2.3"
        injection_strategy: "prompt_injection"
    - role: "Synthesizer"
      role_index: 0
      attack_spec:
        fm_error_type: "FM-1.2"
        injection_strategy: "response_corruption"

experiment_settings:
  max_workers: 5

# LLM-written injection descriptions cost extra calls and are label-side data;
# off by default.
generate_injection_descriptions: false

task_type: "mcq"
prompt_wrapper_style: "direct"
