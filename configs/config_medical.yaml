# Configuration for medical MCQ datasets (MedQA, MedMCQA, PubMedQA, MMLU-medical).
# Used as method_config for DyLAN-style frameworks. AgentVerse/LLM-Debate read
# their own configs under methods/<framework>/configs/.

random_seed: 0

# Agent settings
num_agents: 4
num_rounds: 3
activation: "listwise"
type: "single_choice"   # MCQ. Use "open" for MEDEC; numeric handled by verifier for MedCalc.

roles:
  - "Assistant"
  - "Physician"
  - "Pharmacologist"
  - "Diagnostician"
