# Round caps: user decision 2026-10-21 -- every loop with a round count is capped at 2
# (cost); upstream values are noted where changed.
# DyLAN Method Configuration - MEDICAL roles
# Loaded by DyLAN_Main / DyLAN_MMLU when method_config_name == "config_medical".
# The role names here MUST exist in dylan_main.py:_get_role_map() and
# utils_mmlu.py:ROLE_MAP (medical roles were added there).

random_seed: 0
debug: false

num_agents: 4
# DyLAN needs num_rounds > 2 (dylan_main.py asserts it, and the network is built from this value in
# __init__, so a later override cannot add rounds). With 2 every run failed (empty AssertionError,
# found 2026-11-03). 3 = the two answer rounds + one ranked round, the smallest valid value (upstream 3).
num_rounds: 3
activation: "listwise"
type: "open-ended"

# Medical expert panel.
roles:
  - "Physician"
  - "Pharmacologist"
  - "Pathologist"
  - "Medical_Researcher"
